<div class="row">
    <div class="col-12">
        <div id="title" class="h3 bolded-blue text-center">
            <span data-i18n="study-attitudes-towards-ai-title"></span>
            <!-- <a class="bi bi-question-circle" style="cursor: pointer" onclick="show_data_info()"></a> -->
        </div>
        <div id="data_info_alert" class="alert alert-warning alert-dismissible hidden" role="alert">
            <span data-i18n="litw-demographics-title-tip"></span>
            <!-- <button type="button" class="btn-close" onclick="hide_data_info()"></button> -->
        </div>
        <p class="text-center" id="requiredMessage" data-i18n="study-attitudes-towards-ai-description"></p>
        <br>
    </div>
</div>

<div id="attitudes" class= "survey_template_km" style="text-align: left"></div>
    

<script type="text/javascript">


    var buildSurveyItemObj = function(key){
        console.log("buildSurveyItemObj", key)
        /* Convert litw-decision-making-questions-vigilance-p1 to vigilance-p1 */
        const keySuffix = key.split('-').slice(1).join('-');

        return ({
            [keySuffix]: {
                "title": $.i18n(key),
                //  Strongly Disagree, Somewhat Disagree, Neutral, Somewhat Agree, Strongly Agree, Prefer not to answer
                "enum": ['Strongly disagree', 'Somewhat disagree', 'Neutral', 'Somewhat agree', 'Strongly agree'],
                "required": true,
                "default": "---",
                "disallow": ["---"]
            }}
        );
    }

    var validator = function (callback) {
        var value = this.getValue();
        if (value == "---") {
            callback({
                "status": false,
                "message": "An item must be selected for each question."
            });
        } else {
            callback({
                "status": true
            });
        }
    };

    $(document).ready(function () {
        const surveyQuestions = [ "study-attitudes-towards-ai-q1",
							"study-attitudes-towards-ai-q2",
							"study-attitudes-towards-ai-q3",
							"study-attitudes-towards-ai-q4",
							"study-attitudes-towards-ai-q5",
							"study-attitudes-towards-ai-q6",
							"study-attitudes-towards-ai-q7",
							"study-attitudes-towards-ai-q8",
							"study-attitudes-towards-ai-q9",
							"study-attitudes-towards-ai-q10",
							"study-attitudes-towards-ai-q11",
							"study-attitudes-towards-ai-q12"]
        // randomize the questions before 
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]]; // Swap elements
            }
        }
        const shuffledQuestions = [...surveyQuestions];
        shuffleArray(shuffledQuestions); // Shuffle the array before processing
        console.log("Shuffled questions",shuffledQuestions)
        /* not the best hack to get the survey items from the page data */
        
        const surveyItemsObj = shuffledQuestions.map((key) => buildSurveyItemObj(key)).reduce((acc, curr) => ({...acc, ...curr}), {});
        console.log("Survey item object ",surveyItemsObj);
        // configure each statement for options to have the same settings
        const surveyOptionsObj = {};
        const keysArray = Object.keys(surveyItemsObj);
        for (let index = 0; index < keysArray.length; index++){
            let key = keysArray[index];
            surveyOptionsObj[key] = {
                "type": "radio",
                "optionLabels": ["Strongly Disagree", "Somewhat Disagree", "Neutral", "Somewhat Agree", "Strongly Agree"],
                "hideInitValidationError": true,
                "validator": validator,
                "validate": true,
                "hideNone": true,
                "showMessages": false,
                "sort": false,
                "fieldClass": "alpaca-field-radio",
            }
        };

        $("#attitudes").alpaca({
            "data": false,
            "schema": {
                "description": "LITW Project - Demographics",
                "type": "object",
                "properties": surveyItemsObj
            },
            "options": {
                // load the configured options from above
                "fields": surveyOptionsObj,
                "order": shuffledQuestions
            },
            "postRender": function (control) {
                $('#btn-next-page').attr('style', 'display:none;');
                $(".alpaca-required-indicator").html(" *");
                $("input[type='text']").css('width', '200px');

                const keys = Object.keys(surveyItemsObj);
                console.log(keys);
                for (let index = 0; index < keys.length; index++) {
                    const key = keys[index];
                    const nextKey = keys[index + 1] || null;

                    // Controls the scroll into view for the next question
                    control.childrenByPropertyId[key].on("change", () => {
                        if (control.childrenByPropertyId[key].getValue() !== "---") {
                            if (!nextKey) {
                                $('#btn-next-page')[0].scrollIntoView();
                                return;
                            }
                            // syntax: for all div that has this name == to the next key, scroll into view
                            $(`div[data-alpaca-container-item-name='${nextKey}']`)[0].scrollIntoView(
                                {
                                    behavior: 'smooth',
                                    block: 'center'
                                }
                            );
                        }
                    })


                }


            },

            "view": {
                "callbacks": {
                    "valid": function () {
                        $('#btn-next-page').attr('style', 'display:block;');
                        //  $('#btn-next-page')[0].scrollIntoView();
                    },
                    "invalid": function () {
                        $('#btn-next-page').attr('style', 'display:none;');
                    }
                }
            }
        });




    });

</script>
